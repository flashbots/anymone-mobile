[package]
name = "panetiere-mobile-tools"
description = "Desktop drivers for the handset benchmark cell and the host-CSV merge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anymone-bench = { path = "../../crates/anymone-bench" }
