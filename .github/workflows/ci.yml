name: ci

# anymone and adcnet-rs are private, and a deploy key opens only the repository
# it belongs to, so each needs its own in the agent before cargo fetches. The
# anymone revision the mobile crate builds against is pinned in
# crates/anymone-ffi/Cargo.toml.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: which platforms to build
        type: choice
        default: both
        options: [both, android, ios]
      testflight:
        description: upload a TestFlight build
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # cargo's built-in libgit2 stops at the first key the agent offers that
  # GitHub rejects, so with one deploy key per private repo it never reaches
  # the second. The git CLI tries them all.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  host-and-android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ANYMONE_DEPLOY_KEY }}
      - name: Vendor adcnet-rs with its own deploy key
        env:
          ADCNET_DEPLOY_KEY: ${{ secrets.ADCNET_DEPLOY_KEY }}
        run: ./scripts/ci-git-auth.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Host tests
        run: cargo test -p anymone-ffi
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - name: Android cross-build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --locked
          ./scripts/build-android.sh
      - name: Gradle build
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: anymone-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ANYMONE_DEPLOY_KEY }}
      - name: Vendor adcnet-rs with its own deploy key
        env:
          ADCNET_DEPLOY_KEY: ${{ secrets.ADCNET_DEPLOY_KEY }}
        run: ./scripts/ci-git-auth.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: XCFramework + bindings
        run: ./scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AnymoneFFI.xcframework
          path: ios/AnymoneKit/AnymoneFFI.xcframework
      - name: Build the app for the simulator
        working-directory: ios/AnymoneApp
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -scheme AnymoneApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload to TestFlight
        if: inputs.testflight
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: ./scripts/testflight.sh
