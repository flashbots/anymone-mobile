name: ci

# Checkouts and cargo fetches are anonymous, so a pull request from a fork builds
# without any secret.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: which platforms to build
        type: choice
        default: both
        options: [both, android, ios]
      archive:
        description: publish a Release archive for the TestFlight lane
        type: boolean
        default: true
      anymone_ref:
        description: anymone revision containing anymone-ffi
        type: string
        default: d278e1a76d0dfa6693d07034e3948a0d0e9e361e

env:
  CARGO_TERM_COLOR: always
  ANYMONE_DIR: ${{ github.workspace }}/anymone-source
  # Keep in step with the anymone-core rev pinned in Cargo.toml.
  ANYMONE_REF: ${{ inputs.anymone_ref || 'd278e1a76d0dfa6693d07034e3948a0d0e9e361e' }}

jobs:
  # Separate from the build jobs so a failing test is visible as a red job
  # without withholding the artifacts.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flashbots/anymone
          ref: ${{ env.ANYMONE_REF }}
          path: anymone-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every target reports, so one broken test does not hide the next.
      - run: cargo test --manifest-path "$ANYMONE_DIR/Cargo.toml" --no-fail-fast -p anymone-ffi
      - run: cargo test --no-fail-fast -p anymone-bench

  host-and-android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flashbots/anymone
          ref: ${{ env.ANYMONE_REF }}
          path: anymone-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # Two cargo target dirs plus the NDK do not fit next to the image's
      # preinstalled toolchains. The Android SDK stays — gradle needs it.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
            /usr/local/share/boost /usr/local/lib/node_modules
          df -h /
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - name: Android cross-build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --locked
          ./scripts/build-android.sh
      # AGP 8.5.2 supports Gradle 8.7+ but not 9.x, and the runner image ships 9.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Gradle build
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: anymone-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    # macOS runners are scarce and slow to queue, so pull requests skip this lane;
    # it runs on main and on demand.
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.platform != 'android')
    # App Store Connect rejects anything built with an SDK older than iOS 26,
    # and macos-15 tops out at Xcode 16.4.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flashbots/anymone
          ref: ${{ env.ANYMONE_REF }}
          path: anymone-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          # Off by default, so a failure in xcodebuild discards the cargo cache.
          cache-on-failure: true
      - name: XCFramework + bindings
        env:
          TARGETS: ${{ (github.event_name != 'workflow_dispatch' || inputs.archive) && 'aarch64-apple-ios' || 'aarch64-apple-ios aarch64-apple-ios-sim' }}
        run: ./scripts/build-ios.sh
      - run: brew install xcodegen
      - name: Build the app for the simulator
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.archive }}
        working-directory: ios/AnymoneApp
        run: |
          xcodegen generate
          # ARCHS pins the one simulator slice build-ios.sh produces; a generic
          # destination would also demand x86_64.
          xcodebuild build -scheme AnymoneApp \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO

      # The artifact includes an unsigned archive and Release entitlements.
      - name: Release archive
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.archive }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/archive-ios.sh
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.archive }}
        with:
          name: AnymoneApp.xcarchive.tar.gz
          path: ios/AnymoneApp/build/AnymoneApp.xcarchive.tar.gz
