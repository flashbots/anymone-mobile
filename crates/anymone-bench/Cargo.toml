[package]
name = "anymone-bench"
description = "On-device benchmarks for the client-side Anymone/Panetière crypto, exposed over UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "anymone_bench"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
anymone-core = { workspace = true }
libc = "0.2"
once_cell = "1"
panetiere = { workspace = true }
rand_chacha = "0.3"
rayon = "1"
thiserror = "1"
uniffi = { workspace = true }
