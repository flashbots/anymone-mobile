[package]
name = "anymone-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "anymone_ffi"
# staticlib for the iOS xcframework, cdylib for Android and for uniffi's
# library-mode bindgen.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
anymone-core = { git = "ssh://git@github.com/flashbots/anymone", rev = "49a2d7710a5289ebc2bb0cef5717c1a869cff3d0" }
panetiere = { git = "https://github.com/flashbots/panetiere", rev = "94eac72385ca73f615b4f97861fcf7a56a4a67ab" }
rand_chacha = "0.3"
rayon = "1"
libc = "0.2"
uniffi = { version = "0.29", features = ["tokio", "cli"] }
async-trait = "0.1"
once_cell = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
# mobile-attest so the tests drive the real platform verifiers, test-util for
# their minters.
anymone-core = { git = "ssh://git@github.com/flashbots/anymone", rev = "49a2d7710a5289ebc2bb0cef5717c1a869cff3d0", features = [
    "test-util",
    "mobile-attest",
] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "panetiere-mobile-merge"
path = "src/bin/panetiere-mobile-merge.rs"

[[bin]]
name = "panetiere-mobile-bench"
path = "src/bin/panetiere-mobile-bench.rs"
