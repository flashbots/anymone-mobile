[package]
name = "anymone-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "anymone_ffi"
# staticlib for the iOS xcframework, cdylib for Android and for uniffi's
# library-mode bindgen.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
anymone-core = { git = "ssh://git@github.com/flashbots/anymone", rev = "3170308705cfb64e2bb0b6df8abcd964368f446f" }
uniffi = { version = "0.29", features = ["tokio", "cli"] }
async-trait = "0.1"
once_cell = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
# mobile-attest so the tests drive the real platform verifiers, test-util for
# their minters.
anymone-core = { git = "ssh://git@github.com/flashbots/anymone", rev = "3170308705cfb64e2bb0b6df8abcd964368f446f", features = [
    "test-util",
    "mobile-attest",
] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
