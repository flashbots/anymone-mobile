[package]
name = "anymone-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "anymone_ffi"
# staticlib for the iOS xcframework, cdylib for Android and for uniffi's
# library-mode bindgen.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
anymone-core = { git = "ssh://git@github.com/flashbots/anymone", rev = "eeae218fda1403d6ce7fcbac2befca3c2654a5d2" }
panetiere = { git = "https://github.com/flashbots/panetiere", rev = "e5c9cdf033b4873ee3a97210d97b37f435c5f573" }
rand_chacha = "0.3"
rayon = "1"
libc = "0.2"
uniffi = { version = "0.29", features = ["tokio", "cli"] }
async-trait = "0.1"
once_cell = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
# mobile-attest so the tests drive the real platform verifiers, test-util for
# their minters.
anymone-core = { git = "ssh://git@github.com/flashbots/anymone", rev = "eeae218fda1403d6ce7fcbac2befca3c2654a5d2", features = [
    "test-util",
    "mobile-attest",
] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "panetiere-mobile-merge"
path = "src/bin/panetiere-mobile-merge.rs"

[[bin]]
name = "panetiere-mobile-bench"
path = "src/bin/panetiere-mobile-bench.rs"
