[package]
name = "anymone-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "anymone_ffi"
# staticlib for the iOS xcframework, cdylib for Android and for uniffi's
# library-mode bindgen.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
anymone-core = { git = "ssh://git@github.com/flashbots/anymone", rev = "1f85972e44e6ca08d58c9a935240301a1c131b03" }
panetiere = { git = "https://github.com/flashbots/panetiere", rev = "26560cf2265d49c59cf318401e15fc8464b1279d", features = [
    "rns",
] }
rand_chacha = "0.3"
rayon = "1"
uniffi = { version = "0.29", features = ["tokio", "cli"] }
async-trait = "0.1"
once_cell = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
# mobile-attest so the tests drive the real platform verifiers, test-util for
# their minters.
anymone-core = { git = "ssh://git@github.com/flashbots/anymone", rev = "1f85972e44e6ca08d58c9a935240301a1c131b03", features = [
    "test-util",
    "mobile-attest",
] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "panetiere-mobile-merge"
path = "src/bin/panetiere-mobile-merge.rs"
