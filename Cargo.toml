[workspace]
resolver = "2"
members = [
    "crates/anymone-bench",
    "tools/panetiere-mobile",
    "tools/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/flashbots/anymone-mobile"

[workspace.dependencies]
anymone-core = { git = "https://github.com/flashbots/anymone", rev = "d278e1a76d0dfa6693d07034e3948a0d0e9e361e" }
panetiere = { git = "https://github.com/flashbots/panetiere", rev = "e994fd9a00d0f7f81d72a169b876bbc792690667" }
uniffi = "0.29"

[profile.dev]
opt-level = 1

# Same overrides as the anymone workspace: at opt-level 0 the crypto is 6-8x
# slower and the round loops wedge.
[profile.dev.package.panetiere]
opt-level = 2

[profile.dev.package.adcnet]
opt-level = 2

[profile.dev.package.chipmunk_code]
opt-level = 2

[profile.dev.package.negacyclic-rings]
opt-level = 2

[profile.dev.package.num-bigint]
opt-level = 2

[profile.release]
lto = "thin"
