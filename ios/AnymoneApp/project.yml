# `xcodegen generate` in this directory produces AnymoneApp.xcodeproj.
# Kept as YAML because the project is generated in CI, not edited locally.
name: AnymoneApp
options:
  bundleIdPrefix: net.flashbots
  # Whatever xcodegen brew installs would otherwise write its own era's format;
  # 56 is what Xcode 15 reads, and the runner has 15.4.
  objectVersion: 56
  deploymentTarget:
    iOS: "15.0"
packages:
  AnymoneKit:
    path: ../AnymoneKit
targets:
  AnymoneApp:
    type: application
    platform: iOS
    sources:
      - path: AnymoneApp
    dependencies:
      - package: AnymoneKit
        product: AnymoneKit
    info:
      path: AnymoneApp/Info.plist
    settings:
      base:
        # App Attest attests under the team that signs the build, and the relay
        # policy pins team_id.bundle_id — renaming either is a signed
        # network-config change.
        PRODUCT_BUNDLE_IDENTIFIER: net.flashbots.anymone
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # TestFlight and the App Store need the production environment; only
        # locally Xcode-signed builds may use the develop AAGUID.
        Debug:
          CODE_SIGN_ENTITLEMENTS: AnymoneApp/AnymoneApp.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: AnymoneApp/AnymoneApp.entitlements
schemes:
  AnymoneApp:
    build:
      targets:
        AnymoneApp: all
    archive:
      config: Release
