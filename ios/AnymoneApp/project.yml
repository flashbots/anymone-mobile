# `xcodegen generate` in this directory produces AnymoneApp.xcodeproj.
# Kept as YAML because the project is generated in CI, not edited locally.
name: AnymoneApp
options:
  bundleIdPrefix: net.panetiere
  deploymentTarget:
    # 16 for ShareLink, which exports the benchmark CSV.
    iOS: "16.0"
packages:
  AnymoneKit:
    path: ../AnymoneKit
targets:
  AnymoneApp:
    type: application
    platform: iOS
    sources:
      - path: AnymoneApp
    dependencies:
      - package: AnymoneKit
        product: AnymoneKit
      - package: AnymoneKit
        product: AnymoneBenchKit
    settings:
      base:
        INFOPLIST_FILE: AnymoneApp/Info.plist
        # App Attest attests under the team that signs the build, and the relay
        # policy pins team_id.bundle_id — renaming either is a signed
        # network-config change.
        PRODUCT_BUNDLE_IDENTIFIER: net.panetiere.dev
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # TestFlight and the App Store need the production environment; only
        # locally Xcode-signed builds may use the develop AAGUID.
        Debug:
          CODE_SIGN_ENTITLEMENTS: AnymoneApp/AnymoneApp.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: AnymoneApp/AnymoneApp.entitlements
schemes:
  AnymoneApp:
    build:
      targets:
        AnymoneApp: all
    archive:
      config: Release
